services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    # Do not bind host port 3000 — Coolify/Traefik routes to the container on the internal network.
    # In Coolify: set the app domain and expose port 3000 on the `app` service.
    expose:
      - "3000"
    environment:
      # MongoDB – Option 1: Connection URI (mongoose, Node)
      - MONGODB_URI=${MONGODB_URI}
      # MongoDB – Option 2: Data API / App Services (Cloudflare-compatible)
      - MONGODB_APP_ID=${MONGODB_APP_ID}
      - MONGODB_API_KEY=${MONGODB_API_KEY}
      - MONGODB_DATA_SOURCE=${MONGODB_DATA_SOURCE:-Cluster0}
      - MONGODB_DATABASE=${MONGODB_DATABASE:-mydb}
      - MONGODB_USE_DATA_API=${MONGODB_USE_DATA_API:-false}
      # App
      - API_URL=${API_URL}
      - API_SECRET=${API_SECRET}
      - CRON_SECRET=${CRON_SECRET}
      # External weather APIs
      - WEATHER_COM_API_KEY=${WEATHER_COM_API_KEY}
      - WEATHERLINK_API_KEY=${WEATHERLINK_API_KEY}
      - WEATHERLINK_API_SECRET=${WEATHERLINK_API_SECRET}
      # Optional cache TTLs (ms)
      - PWS_OBSERVATIONS_CURRENT_CACHE_TTL_MS=${PWS_OBSERVATIONS_CURRENT_CACHE_TTL_MS:-60000}
      - PWS_OBSERVATIONS_ERROR_CACHE_TTL_MS=${PWS_OBSERVATIONS_ERROR_CACHE_TTL_MS:-300000}
      - PWS_401_LOG_INTERVAL_MS=${PWS_401_LOG_INTERVAL_MS:-120000}
      - SOUTH_TIROL_SENSORS_CACHE_TTL_MS=${SOUTH_TIROL_SENSORS_CACHE_TTL_MS:-300000}
      - SOUTH_TIROL_SENSORS_ERROR_CACHE_TTL_MS=${SOUTH_TIROL_SENSORS_ERROR_CACHE_TTL_MS:-300000}
      - FOEHN_SERIES_CACHE_TTL_MS=${FOEHN_SERIES_CACHE_TTL_MS:-300000}
      - FOEHN_SERIES_ERROR_CACHE_TTL_MS=${FOEHN_SERIES_ERROR_CACHE_TTL_MS:-900000}
      - FOEHN_DIFF_CACHE_TTL_MS=${FOEHN_DIFF_CACHE_TTL_MS:-300000}
      - FOEHN_DIFF_ERROR_CACHE_TTL_MS=${FOEHN_DIFF_ERROR_CACHE_TTL_MS:-900000}
      - OPEN_METEO_REQUEST_GAP_MS=${OPEN_METEO_REQUEST_GAP_MS:-400}
    restart: unless-stopped
